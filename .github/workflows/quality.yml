name: Quality Gate
on:
  push:
    branches: [main]
    paths-ignore:
      - 'package-lock.json'
      - 'artifacts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://kzexzrdiyzjjtmzrgkiy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_RfupMn8Of8osvRFZXCprrQ_mSVYY8Qd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile QA
        run: npm run test:e2e
      - name: Commit verified lockfile and QA screenshots
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json artifacts/*.png
          git diff --cached --quiet || (git commit -m 'chore: add verified build lockfile and QA captures' && git push)
      - name: Upload screenshots and 30+ second showcase recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-showcase-assets
          path: |
            artifacts/
            test-results/
          retention-days: 14
